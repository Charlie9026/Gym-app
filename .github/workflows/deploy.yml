# Tests the app on every push, then publishes it to GitHub Pages if the tests pass.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main, claude/zen-albattani-jeesan]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: true
      - name: Java for the Firebase emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cloud sync tests (Firebase emulator)
        run: npm run test:sync
        env:
          CI: true

  deploy:
    needs: test
    # Only publish from pushes and manual runs, never from pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lets the deploy step find the uploaded site
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
